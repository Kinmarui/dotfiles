# Distro-side WSL settings — installed to /etc/wsl.conf by install/wsl.sh.
# Takes effect after `wsl --shutdown` from Windows.

[network]
# Let WSL write /etc/resolv.conf itself (pointing at its DNS-tunneling
# resolver), so lookups go through Windows and resolve exactly as they do
# there: Tailscale MagicDNS names, OpenVPN split DNS, then the internet.
# A static resolv.conf (e.g. 8.8.8.8) bypasses all of that.
generateResolvConf = true
